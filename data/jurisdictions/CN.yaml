history:
  trade_secret.statute:
    - value: { name: "反不正当竞争法 (Anti-Unfair Competition Law, as amended 2019)" }
      in_force_from: 2019-04-23
      in_force_until: 2025-10-14
      cite: "反不正当竞争法 (AUCL), amended 23 April 2019"
      notes: ["33 articles. Superseded by the 2025 amendment in force 15 October 2025."]
  trade_secret.basis:
    - value: statutory
      in_force_from: 2019-04-23
      in_force_until: 2025-10-14
      cite: "反不正当竞争法 第9条 (AUCL 2019, Art 9)"
      notes: ["Trade secrets sat at Art 9 until the 2025 renumbering moved them to Art 10."]
  trade_secret.elements:
    - value: ["not known to the public", "commercial value", "subject to confidentiality measures taken by the right holder"]
      in_force_from: 2019-04-23
      in_force_until: 2025-10-14
      cite: "反不正当竞争法 第9条第4款 (AUCL 2019, Art 9, para 4)"
  trade_secret.burden_shifting:
    - value: true
      in_force_from: 2019-04-23
      in_force_until: 2025-10-14
      cite: "反不正当竞争法 第32条 (AUCL 2019, Art 32)"
      notes: ["Burden-shifting was introduced by the 2019 amendment at Art 32; it is Art 39 in the 2025 text."]
  registered_design.term:
    - value: { years: 10, from: filing_date, renewable: false }
      in_force_from: 1985-04-01
      in_force_until: 2021-05-31
      cite: "专利法 第42条 (Art 42, pre-2020 amendment)"
      notes: ["Design patents filed before 1 June 2021 have a 10-year term. A portfolio spanning the amendment has two different expiry rules."]
  registered_design.partial_designs:
    - value: { available: false }
      in_force_from: 1985-04-01
      in_force_until: 2021-05-31
      cite: "专利法 第2条 (pre-2020 amendment)"
      notes: ["Partial designs could not be claimed; whole-product designs only."]
  patent.term_extension:
    - value: { available: false }
      in_force_from: 1985-04-01
      in_force_until: 2021-05-31
      cite: "专利法 第42条 (pre-2020 amendment)"
      notes: ["No term compensation of any kind before the 2020 amendment."]
