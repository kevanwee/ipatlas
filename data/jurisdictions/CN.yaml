takedown:
  copyright:
    regime: { value: cn_ecommerce_and_network_regulations, cite: "电子商务法 第42-45条; 信息网络传播权保护条例" }
    statutory_notice: { value: true, prescribed_form: false, cite: "电子商务法 第42条 (E-Commerce Law, Art 42)" }
    required_elements:
      value:
        - "identity and contact details of the right holder"
        - "preliminary evidence of the right (registration certificate, ownership proof)"
        - "identification of the infringing goods or content and its location on the platform"
        - "statement of the grounds of infringement"
        - "undertaking as to the truthfulness of the notice"
      cite: "信息网络传播权保护条例 第14条 (Regulations on Protection of the Right of Communication through Information Networks, Art 14); 电子商务法 第42条 (preliminary evidence requirement only)"
      notes:
        - "E-Commerce Law Art 42 itself requires only that the notice include PRELIMINARY EVIDENCE of the infringement. The itemised elements come from the Regulations Art 14 and from platform rules."
        - "Attribution corrected 2026-09-12: the list was previously presented as the requirements of ECL Art 42."
    counter_notice:
      available: true
      platform_wait_days: 15
      cite: "电子商务法 第43条 (E-Commerce Law, Art 43)"
      notes: ["On a counter-notice the platform forwards it to the complainant and must restore the listing if no complaint or action is filed within 15 days. A fixed statutory clock, unlike the DMCA's 10-14 business-day band."]
    bad_faith_liability:
      value: true
      multiplier: double_damages
      cite: "电子商务法 第42条第3款 (Art 42, para 3)"
      notes: ["A notice sent in bad faith attracts double liability for the loss caused. Higher exposure than DMCA § 512(f) in practice."]
  trade_mark:
    regime: { value: cn_ecommerce, cite: "电子商务法 第42条 (Art 42)" }
    statutory_notice: { value: true, cite: "电子商务法 第42条 (Art 42)" }
    notes: ["The E-Commerce Law notice regime is right-agnostic and covers trade marks, unlike the US where § 512 is copyright-only."]

# ---------------------------------------------------------------------------------------
# ADOPTED BUT NOT YET IN FORCE. The fifth Trademark Law amendment was adopted on
# 26 June 2026 and commences 1 January 2027, taking the Law from 8 chapters / 73 articles to
# 9 chapters / 87 articles. Entries here win for any query dated on or after commencement;
# the live facts above continue to answer for earlier dates. Nothing needs migrating on the
# commencement date.
#
# THE OPERATIONALLY SIGNIFICANT CHANGE is the opposition window: three months becomes TWO.
# Watching services and internal escalation paths need changing BEFORE 1 January 2027.
pending:
  trade_mark.opposition:
    - value:
        window_months: 2
        from: publication
        extendable: false
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第36条 (Trademark Law as amended 2026, Art 36)"
      notes:
        - "对初步审定公告的商标，自公告之日起二个月内…可以向国务院商标管理部门提出异议 - TWO months from publication, down from three. Still not extendable."
        - "Art 33 in the current text becomes Art 36. Verified 2026-09-12 against the CNIPA official text and corroborated against Lee & Li and Chang Tsi commentary because the change is consequential."
        - "Whether the two-month period applies to marks published BEFORE 1 January 2027 whose three-month window is still running is a transitional question not addressed in the statute text. Do not guess at it."
  trade_mark.filing_system:
    - value: first_to_file
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第35条 (Trademark Law as amended 2026, Art 35)"
      notes:
        - "First-to-file unchanged in substance; Art 31 renumbers to Art 35."
        - "Bad-faith refusal moves from Art 4 to Art 19 and is strengthened by a 明显超出正常生产经营需要 limb (manifestly exceeding normal business needs). New Art 54 makes bad-faith filing administratively punishable: a warning plus a fine of up to RMB 100,000."
  trade_mark.use_requirement:
    - value:
        non_use_years: 3
        consequence: cancellation_on_application_or_cnipa_own_motion
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第57条 (Trademark Law as amended 2026, Art 57)"
      notes:
        - "Three years unchanged. Art 49 renumbers to Art 57."
        - "NEW: CNIPA gains an OWN-MOTION revocation power for generic-name and three-year-non-use grounds (国务院商标管理部门可以撤销该注册商标), and must decide a cancellation application within 9 months, extendable by 3."
  trade_mark.term:
    - value: { years: 10, from: registration_date, renewable: true, renewal_years: 10 }
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第43-44条 (Trademark Law as amended 2026, Arts 43-44)"
      notes: ["Substance unchanged: 10 years from registration, renewable for 10. Arts 39-40 renumber to Arts 43-44."]
  trade_mark.priority:
    - value: { months: 6, treaty: paris }
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第29条 (Trademark Law as amended 2026, Art 29); 第30条 (exhibition priority)"
      notes: ["Six months unchanged. Art 25 splits into Art 29 (Paris/foreign priority) and Art 30 (exhibition priority)."]
  trade_mark.multi_class:
    - value: true
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第26条 (Trademark Law as amended 2026, Art 26)"
      notes: ["Unchanged. Art 22 renumbers to Art 26."]
  trade_mark.well_known_marks:
    - value:
        protected: true
        registration_required: false
        recognition: case_by_case
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第21条 (substantive protection); 第63条 (factors); 第69条 (outbound confirmation)"
      notes:
        - "Arts 13-14 renumber to Art 21 plus Art 63. Art 21 now bars bad-faith filing against a well-known mark whether or not it is registered in China. Terminology changes from 认定 to 确认."
        - "NEW Art 69: CNIPA may confirm that a mark is well known among the relevant public in China in order to support protection ABROAD. A new evidentiary artefact foreign practitioners will encounter."
  trade_mark.exhaustion:
    - value: unsettled
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 (as amended 2026) - no exhaustion provision; cf 第72条 (infringing acts)"
      notes:
        - "The fifth amendment does NOT introduce an exhaustion provision. The 2026 text was searched for 权利用尽 and for any exhaustion limb in the infringement article (Art 72, successor to Art 57): none exists."
        - "So `unsettled` survives the amendment, and the instruction in the live entry not to convert it to `international` without an SPC decision or a statutory amendment still stands."
  transfer_formalities.trade_mark_assignment.recordal:
    - value: mandatory
      adopted: 2026-06-26
      in_force_from: 2027-01-01
      verified: true
      cite: "商标法 第46条 (Trademark Law as amended 2026, Art 46)"
      notes:
        - "Constitutive effect unchanged: 转让注册商标经核准后，予以公告。受让人自公告之日起享有注册商标专用权 - the assignee holds the exclusive right from the date of publication."
        - "The assign-similar-marks-together rule also survives verbatim. Art 42 renumbers to Art 46."

