# ipatlas jurisdiction pack: China (mainland)
#
# Citations give the Chinese article reference with an English gloss, per CLAUDE.md.
# Hong Kong, Macau and Taiwan are separate jurisdictions and separate packs; nothing in this
# file applies to them.
#
# VERIFICATION STATE: facts marked `verified: true` were checked on the date in their notes.
# Facts without the flag are unchecked. Where a correction was made the note records what the
# previous entry said, so the error is auditable.
#
# KNOWN PENDING CHANGE: the fifth Trademark Law amendment was adopted on 26 June 2026 and
# takes effect 1 January 2027. The trade_mark block below states the law in force TODAY and
# does not yet model the amendment; see the `pending_amendment` note on trade_mark.statute.

jurisdiction: CN
name: China (mainland)
office: CNIPA
office_name: China National Intellectual Property Administration
languages: [zh]
legal_system: civil_law
currency: CNY

defaults:
  checked: 2026-09-12
  verified: false

memberships:
  value: [paris, trips, berne, pct, madrid, hague, budapest, wct, wppt, marrakesh, upov]
  cite: "WIPO-administered treaties: contracting parties list (China)"
  url: https://www.wipo.int/wipolex/en/treaties/ShowResults?country_id=38C
  notes: ["Acceded to the Hague Agreement (1999 Geneva Act) with effect from 5 May 2022."]

# ---------------------------------------------------------------------------------------
trade_mark:
  statute: { name: "商标法 (Trademark Law of the PRC, as amended 2019)", url: https://www.cnipa.gov.cn }
  filing_system:
    value: first_to_file
    in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
    cite: "商标法 第31条 (Trademark Law, Art 31)"
    notes:
      - "Strict first-to-file with very limited unregistered protection. Defensive filing before market entry is essential; squatting remains the single largest practical risk for foreign brands."
      - "Art 4 (2019 amendment) allows refusal of applications filed in bad faith with no intention to use, which has become the main tool against squatters."
  examination: { value: substantive, scope: [absolute, relative], cite: "商标法 第28-35条 (Arts 28-35)" }
  multi_class:
    value: true
    in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
    cite: "商标法 第22条 (Art 22)"
    notes: ["Multi-class applications are permitted but are administered as separable registrations; a single application does not create a single indivisible right."]
  classification:
    value: nice
    practice: "CNIPA requires terms from its own subclass system. Goods in different subclasses are generally treated as dissimilar, so a specification drafted for another jurisdiction will leave gaps."
    cite: "商标法 第22条; 类似商品和服务区分表 (CNIPA Classification of Similar Goods and Services)"
    notes: ["The subclass practice has no analogue in SG/US/EU and is the most common cause of an apparently broad Chinese registration being unenforceable against a competitor."]
  priority: { months: 6, treaty: paris, in_force_until: 2026-12-31,
              cite: "商标法 第25条 (Art 25)" }
  term:
    years: 10
    from: registration_date
    in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
    renewable: true
    renewal_years: 10
    cite: "商标法 第39-40条 (Arts 39-40)"
  renewal_grace:
    months: 6
    window_before_expiry_months: 12
    cite: "商标法 第40条 (Art 40)"
    notes: ["Renewal may be filed in the 12 months before expiry, with a 6-month grace period after."]
  maintenance:
    separate_obligation: false
    cite: "商标法 (no declaration of use requirement)"
    notes: ["No periodic proof of use. Non-use is tested only on a third-party cancellation application under Art 49."]
  opposition:
    window_months: 3
    in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
    from: publication
    extendable: false
    cite: "商标法 第33条 (Art 33)"
    notes: ["Three months from publication of the preliminary approval, and it is not extendable. Watching services matter more here than in jurisdictions that grant extensions."]
  use_requirement:
    non_use_years: 3
    consequence: cancellation_on_application
    in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
    cite: "商标法 第49条 (Art 49)"
    notes: ["Three years, against five in Singapore and a three-year abandonment presumption in the US. Evidence of use must be of use in mainland China."]
  well_known_marks:
    protected: true
    in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
    registration_required: false
    recognition: case_by_case
    cite: "商标法 第13-14条 (Arts 13-14)"
    notes: ["Well-known status is determined case by case in the proceeding where it is raised; there is no standing register of well-known marks that confers protection prospectively."]
  exhaustion:
    value: unsettled
    in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
    cite: "商标法 (no express exhaustion provision)"
    notes:
      - "The Trademark Law contains no exhaustion article and outcomes in parallel-import cases have diverged between courts, often turning on quality differences, repackaging and consumer confusion rather than on a clean exhaustion rule."
      - "Recorded as unsettled deliberately. Do not convert this to `international` without a decision of the SPC or a statutory amendment to cite."
  border_measures:
    available: true
    mechanism: "recordal with the General Administration of Customs; customs may detain ex officio once recorded"
    cite: "知识产权海关保护条例 (Regulations on Customs Protection of IP Rights)"
    notes: ["Ex officio detention on a recorded right is a materially stronger tool than the application-based seizure regimes in several common-law jurisdictions."]
  criminal_sanctions:
    available: true
    cite: "刑法 第213-215条 (Criminal Law, Arts 213-215), as amended by Criminal Law Amendment (XI)"
    notes:
      - "Criminal Law Amendment (XI), in force 1 March 2021, raised the maximum term for the counterfeiting offences from 7 to 10 years and removed the fixed fine bands. The bare article citation hides that change."
      - "This statement rests on a single comparison table rather than a direct read of Arts 213-215; it is weaker than the corresponding statement for Art 219. Verify before advising on sentencing exposure."
  madrid:
    designation_accepted: true
    refusal_window_months: 18
    individual_fee: false
    cite: "商标法 第21条; Madrid Protocol Art 5(2)(b) declaration"
    notes: ["A Madrid designation of China is examined under CNIPA subclass practice, so the specification translated from the basic mark often under-covers. Many practitioners file nationally for this reason."]

# ---------------------------------------------------------------------------------------
patent:
  statute: { name: "专利法 (Patent Law of the PRC, as amended 2020, effective 1 June 2021)", url: https://www.cnipa.gov.cn }
  types:
    value: [invention, utility_model, design]
    cite: "专利法 第2条 (Art 2)"
    notes: ["One statute covers three rights with different terms and examination. `patent` in this pack means an invention patent; see `utility_model` and `registered_design`."]
  filing_system: { value: first_to_file, cite: "专利法 第9条 (Art 9)" }
  examination: { value: substantive, cite: "专利法 第35条 (Art 35)" }
  priority: { months: 12, treaty: paris, cite: "专利法 第29条 (Art 29)" }
  term: { years: 20, from: filing_date, cite: "专利法 第42条 (Art 42)" }
  term_extension:
    available: true
    grounds: [office_delay_compensation, pharmaceutical_marketing_approval]
    max_years: 5
    in_force_from: 2021-06-01
    cite: "专利法 第42条第2-3款 (Art 42, paras 2-3)"
    notes: ["Introduced by the 2020 amendment. Pharmaceutical compensation is capped at 5 years and total effective term post-approval at 14 years."]
  maintenance:
    from_year: 1
    frequency: annual
    due: anniversary_of_filing
    grace_months: 6
    surcharge: true
    verified: true
    cite: "专利法 第43条; 专利法实施细则 第115条 (Implementing Regulations 2023, Rule 115)"
    notes:
      - "专利法 第43条: the patentee pays an annual fee BEGINNING WITH THE YEAR IN WHICH THE PATENT RIGHT IS GRANTED. Corrected 2026-09-12: the pack previously said 'the first year after grant', which is off by one."
      - "Art 43 carries only the duty to pay. Rule 115 carries the timing: 授予专利权当年以后的年费应当在上一年度期满前缴纳 - annuities after the year of grant are due before the end of the preceding year; a 6-month late window applies with a surcharge accruing at 5% of the full annual fee per month overdue, failing which the patent terminates."
      - "Verified 2026-09-12 against the CNIPA official text of the 2023 revision (149 rules, in force 20 January 2024)."
      - "Contrast the US three-fee schedule at 3.5 / 7.5 / 11.5 years from grant."
  grace_period:
    months: 6
    scope: limited_grounds
    grounds:
      - "first public disclosure for the public interest when a state of emergency or extraordinary situation occurred in the country"
      - "first exhibition at an INTERNATIONAL exhibition sponsored or recognised by the Chinese Government"
      - "first publication at a prescribed academic or technological conference"
      - "contents divulged by another person without the applicant's consent"
    cite: "专利法 第24条 (Art 24)"
    notes:
      - "Six months and only on enumerated grounds. An inventor's own ordinary publication is NOT excused, unlike the 12-month self-disclosure grace in the US and Singapore."
      - "This asymmetry is a classic cross-border trap: a US-led programme that relies on § 102(b)(1) destroys novelty in China."
  pct:
    national_phase_months: 30
    from: priority_date
    extension_available: true
    extended_months: 32
    surcharge_for_extension: true
    verified: true
    cite: "专利法实施细则 第120条 (Patent Law Implementing Regulations 2023, Rule 120); PCT Art 48"
    notes:
      - "Rule 120: 申请人应当在…优先权日起30个月内，向国务院专利行政部门办理进入中国国家阶段的手续；申请人未在该期限内办理该手续的，在缴纳宽限费后，可以在自优先权日起32个月内办理 - 30 months, extendable to 32 on payment of a grace fee."
      - "Verified 2026-09-12 against the CNIPA official text and the MOJ administrative-regulations database. An earlier entry cited Rule 103, which was wrong; the DISPUTED flag it carried is now cleared."
  exhaustion: { value: international, cite: "专利法 第75条第1项 (Art 75(1))" }
  border_measures: { available: true, mechanism: "customs recordal as for trade marks", cite: "知识产权海关保护条例" }
  criminal_sanctions: { available: true, scope: counterfeit_patent_marking_only, cite: "刑法 第216条 (Criminal Law, Art 216)" }

utility_model:
  available: true
  statute: { name: "专利法 (Patent Law)", url: https://www.cnipa.gov.cn }
  subject_matter: { value: shape_structure_of_product, excludes: [processes, methods], cite: "专利法 第2条第3款 (Art 2, para 3)" }
  examination:
    value: formal
    cite: "专利法 第40条 (Art 40)"
    notes: ["No substantive examination before grant, so grant is fast (often under a year) but validity is untested. An evaluation report under Art 66 is usually obtained before enforcement."]
  priority: { months: 12, treaty: paris, cite: "专利法 第29条 (Art 29)" }
  term: { years: 10, from: filing_date, renewable: false, cite: "专利法 第42条 (Art 42)" }
  double_filing:
    value: permitted_same_day
    cite: "专利法 第9条 (Art 9)"
    verified: true
    cite: "专利法 第9条; 专利审查指南 (Patent Examination Guidelines, as amended by CNIPA Order No. 84, in force 1 January 2026)"
    notes:
      - "An invention patent and a utility model may be filed on the same day for the same invention. A fast enforceable right plus a long one."
      - "The Guidelines revision in force 1 January 2026 NARROWS the mechanism: the invention patent may now be obtained only by WAIVING the utility model right (仅允许通过放弃实用新型专利权的方式获得发明专利授权). Earlier practice allowed other routes."
      - "Verified 2026-09-12 against CNIPA Order No. 84 and CNIPA's published policy explanation."
  maintenance: { from_year: 1, frequency: annual, cite: "专利法 第43条 (Art 43)" }

# ---------------------------------------------------------------------------------------
registered_design:
  statute: { name: "专利法 (Patent Law) — design patents", url: https://www.cnipa.gov.cn }
  examination: { value: formal, cite: "专利法 第40条 (Art 40)" }
  priority: { months: 6, treaty: paris, cite: "专利法 第29条 (Art 29)" }
  term:
    years: 15
    from: filing_date
    renewable: false
    in_force_from: 2021-06-01
    cite: "专利法 第42条 (Art 42)"
    notes: ["Extended from 10 to 15 years by the 2020 amendment, aligning with Hague accession."]
  partial_designs:
    available: true
    in_force_from: 2021-06-01
    cite: "专利法 第2条第4款 (Art 2, para 4)"
    notes: ["Partial designs became available under the 2020 amendment; filings before 1 June 2021 could not claim part of a product."]
  grace_period: { months: 6, scope: limited_grounds, cite: "专利法 第24条 (Art 24)" }
  hague: { designation_accepted: true, refusal_window_months: 12, cite: "Hague Geneva Act declaration (effective 5 May 2022)" }
  unregistered_design_right: { available: false, cite: "专利法 (registration required; no unregistered design right)" }

# ---------------------------------------------------------------------------------------
copyright:
  statute: { name: "著作权法 (Copyright Law of the PRC, as amended 2020, effective 1 June 2021)", url: https://www.ncac.gov.cn }
  registration:
    value: available
    required_for_subsistence: false
    cite: "著作权法 第2条; 作品自愿登记试行办法 (Voluntary Registration Measures)"
    notes: ["Voluntary registration with the Copyright Protection Centre of China. Not constitutive, but a registration certificate is the practical evidence of ownership in Chinese enforcement and customs recordal."]
  term:
    literary_dramatic_musical_artistic: { base: author_death, plus_years: 50, cite: "著作权法 第23条 (Art 23)" }
    legal_person_works: { base: publication, plus_years: 50, cite: "著作权法 第23条 (Art 23)" }
    audiovisual_works: { base: publication, plus_years: 50, cite: "著作权法 第23条 (Art 23)" }
    to_end_of_calendar_year:
      value: true
      verified: true
      cite: "著作权法 第23条 (Copyright Law, Art 23)"
      notes:
        - "Art 23 expresses each term as ending on 31 December of the final year (截止于...第五十年的12月31日), not on the anniversary."
        - "Declared explicitly because the term engine must not infer this from prose."
    notes:
      - "Fifty years, not seventy. A work in the public domain in China may still be protected in Singapore or the US, and vice versa where the rule of the shorter term applies."
      - "Terms are calculated to 31 December of the fiftieth year, not to the anniversary date."
  shorter_term_rule:
    notes: ["Not yet researched. Record whether China applies Berne Art 7(8) comparison of terms to foreign works before any engine relies on this."]
  moral_rights:
    available: true
    rights: [publication, attribution, integrity, modification]
    perpetual: [attribution, integrity, modification]
    waivable: false
    waivability_is_inference: true
    cite: "著作权法 第10条 (rights); 第22条 (unlimited term of attribution, modification and integrity)"
    notes:
      - "Art 22: 作者的署名权、修改权、保护作品完整权的保护期不受限制 - the terms of the rights of attribution, modification and integrity are UNLIMITED. Previously cited to Art 23, which is the economic-term article. Corrected 2026-09-12."
      - "The publication right (发表权) is NOT perpetual; its term is limited under Art 23."
      - "NON-WAIVABILITY IS AN INFERENCE, not statutory text. The Law says the term is unlimited and that only the economic rights in Art 10(1)(5)-(17) are transferable (Art 27); it does not expressly say moral rights cannot be waived. Orthodox Chinese practice treats them as non-waivable. Flagged rather than asserted."
  fair_dealing:
    value: closed_list
    semi_closed_after_2020_amendment: true
    cite: "著作权法 第24条 (Art 24)"
    notes:
      - "Twelve enumerated heads plus, since the 2020 amendment, a thirteenth: 法律、行政法规规定的其他情形 - other circumstances provided by laws and administrative regulations. The list is therefore no longer closed on its face, though the catch-all still requires another legal instrument."
      - "Art 24 also opens with a three-step limitation: the user must name the author and the work, and must not affect the normal exploitation of the work or unreasonably prejudice the rights holder's legitimate interests."
      - "Value kept as closed_list because this is not a US-style open standard: a use must still fit an enumerated head or another instrument. Qualification added 2026-09-12."
  safe_harbour:
    available: true
    regime: network_service_provider
    notice_and_takedown: true
    counter_notice: true
    cite: "电子商务法 第42-45条 (E-Commerce Law, Arts 42-45); 信息网络传播权保护条例 (Regulations on Protection of the Right of Communication through Information Networks)"
    notes: ["The E-Commerce Law regime applies to platform operators; the Regulations apply to network service providers generally. Both may bite on the same facts."]
  work_for_hire:
    value: narrow
    cite: "著作权法 第18条 (Art 18)"
    notes: ["Employee-created works generally vest in the author with the employer taking a licence, except in enumerated categories or where agreed. This is the opposite default to the US and must be fixed by contract."]

# ---------------------------------------------------------------------------------------
trade_secret:
  statute:
    value: { name: "反不正当竞争法 (Anti-Unfair Competition Law, as amended 2025)" }
    url: https://www.gov.cn
    in_force_from: 2025-10-15
    adopted: 2025-06-27
    verified: true
    cite: "反不正当竞争法, 第二次修订 (second full revision) adopted by the 16th session of the 14th NPCSC on 27 June 2025, in force 15 October 2025 per Art 41"
    notes:
      - "The 2025 amendment took the AUCL from 33 to 41 articles and RENUMBERED the trade-secret provisions. A pleading citing the 2019 numbering today cites a repealed numbering."
      - "Corrected 2026-09-12: the pack previously described the 2019 version as current."
  basis:
    value: statutory
    in_force_from: 2025-10-15
    cite: "反不正当竞争法 第10条 (AUCL 2025, Art 10)"
    notes:
      - "Art 10 in the 2025 text. It was Art 9 in the 2019 text; see history."
  elements:
    value: ["not known to the public", "commercial value", "subject to confidentiality measures taken by the right holder"]
    in_force_from: 2025-10-15
    verified: true
    cite: "反不正当竞争法 第10条末款 (AUCL 2025, Art 10, final paragraph)"
    notes:
      - "本法所称的商业秘密，是指不为公众所知悉、具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息 - information not known to the public, having commercial value, for which the holder has taken CORRESPONDING confidentiality measures."
      - "相应 means corresponding or commensurate, not merely reasonable: Chinese courts read it as measures proportionate to the value and nature of the information. Do not translate it as a bare reasonableness standard."
      - "The three elements are unchanged from the 2019 text; only the article number moved (Art 9 -> Art 10). Verified 2026-09-12."
  burden_shifting:
    value: true
    in_force_from: 2025-10-15
    cite: "反不正当竞争法 第39条 (AUCL 2025, Art 39)"
    verified: true
    notes:
      - "TWO DISTINCT STAGES, which an earlier note in this entry collapsed into one."
      - "Stage 1 (subsistence), Art 39 para 1: on preliminary evidence that the holder took confidentiality measures AND a reasonable indication of infringement, the alleged infringer must prove the information is NOT a trade secret under the Law."
      - "Stage 2 (infringement), Art 39 para 2: on a reasonable indication of infringement AND any one of three listed evidential routes, the alleged infringer must prove it did not infringe. The routes are (1) access or opportunity to obtain the secret plus information substantially identical to it; (2) the secret has been, or is at risk of being, disclosed or used by the alleged infringer; (3) other evidence of infringement. Limb (2) is materially broader than an access theory."
      - "Art 39 in the 2025 text, carried over verbatim from the 2019 Art 32. Verified 2026-09-12 against the CNIPA official text."
  misappropriation_acts:
    value:
      - "acquisition by theft, bribery, fraud, coercion, ELECTRONIC INTRUSION (电子侵入) or other improper means"
      - "disclosure, use, or permitting use of a secret so acquired"
      - "disclosure or use in breach of a confidentiality obligation or the holder's requirements"
      - "ABETTING, INDUCING or ASSISTING another to breach such an obligation (教唆、引诱、帮助)"
    verified: true
    cite: "反不正当竞争法 第10条第1款(一)-(四) (AUCL 2025, Art 10, paras (1)-(4))"
    notes:
      - "Electronic intrusion and the abetting limb both arrived in the 2019 amendment and are carried forward unchanged into the 2025 text."
      - "Verified 2026-09-12 against the CNIPA official text."
  extraterritorial_application:
    value: true
    in_force_from: 2025-10-15
    verified: true
    cite: "反不正当竞争法 第40条 (AUCL 2025, Art 40)"
    notes:
      - "在中华人民共和国境外实施本法规定的不正当竞争行为，扰乱境内市场竞争秩序的，依照本法以及有关法律的规定处理 - conduct outside China that disrupts domestic market competition order is dealt with under this Law."
      - "New in the 2025 amendment and directly relevant to offshore trade-secret misappropriation affecting the Chinese market."
  statutory_damages:
    value: { max_cny: 5000000, punitive_multiplier_min: 1, punitive_multiplier_max: 5 }
    cite: "反不正当竞争法 (AUCL 2025) - article number unverified"
    article_number_disputed: true
    notes:
      - "Statutory damages up to CNY 5 million where neither actual loss nor infringer profit can be determined, and a 1x to 5x punitive multiplier for wilful infringement in serious circumstances."
      - "ARTICLE NUMBER UNVERIFIED. One source attributed the multiplier to Art 22; it could not be independently corroborated. The SUBSTANCE is well sourced; the article number is not. Do not cite a number from this entry."
  criminal_sanctions:
    available: true
    verified: true
    cite: "刑法 第219条 (Criminal Law, Art 219), as amended by Criminal Law Amendment (XI)"
    notes:
      - "Criminal Law Amendment (XI), in force 1 March 2021, rewrote Art 219: it DELETED the 造成重大损失 (substantial loss) quantum gateway and substituted 情节严重 (serious circumstances, up to 3 years) and 情节特别严重 (3 to 10 years), and added 电子侵入 as a means. A pre-2021 analysis of criminal exposure turns on a threshold that no longer exists."
      - "Consider also Art 219a (第二百一十九条之一), the separate offence of stealing, spying out, buying or unlawfully supplying trade secrets FOR A FOREIGN ENTITY, introduced by Amendment XI. It is the provision most likely to arise in a cross-border matter. Its text has not been checked here."
      - "Verified 2026-09-12 against the Supreme People's Procuratorate text of Amendment XI."

geographical_indication:
  registration:
    value: available
    mechanism: "sui generis GI products scheme plus collective/certification marks"
    cite: "商标法 第16条; CNIPA 地理标志产品保护办法 (Measures for the Protection of GI Products) - instrument unconfirmed"
    instrument_disputed: true
    notes:
      - "Two parallel routes (the CNIPA GI scheme and collective/certification marks). The EU-China GI Agreement (2021) protects listed EU GIs directly."
      - "INSTRUMENT UNCONFIRMED. This entry cited 地理标志产品保护规定 (AQSIQ Order No. 78 of 2005), which is very likely superseded by CNIPA's 地理标志产品保护办法. A verification pass on 2026-09-12 could not reach a primary source. Check cnipa.gov.cn before citing either instrument."

# ---------------------------------------------------------------------------------------
transfer_formalities:
  trade_mark_assignment:
    writing_required: { value: true, cite: "商标法 第42条 (Art 42)" }
    recordal:
      value: mandatory
      in_force_until: 2026-12-31   # superseded by the fifth amendment; see `pending`
      effect: "the assignment takes effect on publication by CNIPA; until then the assignee has no registered right"
      cite: "商标法 第42条 (Art 42)"
      notes: ["Constitutive, not merely protective. Contrast SG and US where recordal affects priority against third parties but the assignment is effective between the parties on execution."]
    all_similar_marks_together:
      value: true
      cite: "商标法 第42条第2款 (Art 42, para 2)"
      notes: ["Identical or similar marks for identical or similar goods must be assigned together. A cherry-picked assignment of part of a family will be refused."]
    government_approval: { value: false, cite: "商标法 第42条 (no approval requirement for trade mark assignment)" }
  patent_assignment:
    writing_required: { value: true, cite: "专利法 第10条 (Art 10)" }
    recordal: { value: mandatory, effect: "effective on registration with CNIPA", cite: "专利法 第10条 (Art 10)" }
    government_approval:
      value: conditional
      condition: assignment_to_foreign_party
      cite: "专利法 第10条 (statutory hook); 技术进出口管理条例 (Regulations on Administration of Technology Import and Export); 中国禁止出口限制出口技术目录 (Catalogue)"
      notes:
        - "专利法 第10条: where a Chinese entity or individual transfers a patent or patent application to a foreigner or foreign organisation, the transfer must go through the formalities in accordance with the relevant laws and administrative regulations."
        - "THREE tiers, not two. FREELY EXPORTABLE technology still needs a MOFCOM registration certificate before CNIPA will record the assignment. RESTRICTED technology needs a MOFCOM export LICENCE and CAN be assigned. Only PROHIBITED technology cannot be assigned at all."
        - "Corrected 2026-09-12: the pack previously said restricted AND prohibited technologies may not be assigned at all, which over-states the bar on restricted technology and under-states the baseline requirement for unrestricted technology."
        - "This is a closing condition, not a formality. Build it into the timetable of any transaction moving Chinese patents offshore."
  copyright_assignment:
    writing_required: { value: true, cite: "著作权法 第27条 (Art 27)" }
    recordal: { value: optional, effect: evidential, cite: "著作权法 (voluntary recordal)" }
    moral_rights_not_assignable: { value: true, cite: "著作权法 第10条 (Art 10)" }

