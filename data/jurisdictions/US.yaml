# Dated changes of law. A query with `as_of` before the current fact's in_force_from
# resolves here instead.
history:
  registered_design.term:
    - value: { years: 14, from: grant_date, renewable: false }
      in_force_from: 1982-01-01
      in_force_until: 2015-05-12
      cite: "35 U.S.C. § 173 (before the Patent Law Treaties Implementation Act of 2012)"
      notes:
        - "14 years from grant. The transition operates by FILING date: a design patent granted on an application filed before 13 May 2015 runs 14 years, not 15."
        - "in_force_from is nominal; the 14-year term long predates 1982. Recorded so a dated query resolves, not as the start of the rule."
  patent.filing_system:
    - value: first_to_invent
      in_force_from: 1790-04-10
      in_force_until: 2013-03-15
      cite: "35 U.S.C. § 102(g) (pre-AIA)"
      notes: ["Priority went to the first to invent, provable by interference proceedings. Applications filed before 16 March 2013 are still examined under pre-AIA law."]
  patent.exhaustion:
    - value: national
      in_force_from: 2001-08-21
      in_force_until: 2017-05-29
      cite: "Jazz Photo Corp v ITC, 264 F.3d 1094 (Fed Cir 2001)"
      notes:
        - "Foreign first sale did not exhaust US patent rights; overruled by Impression Products v Lexmark."
        - "in_force_from is the date of the Jazz Photo decision, 21 August 2001. Corrected from 2001-01-01 on 2026-09-12: the note claimed the field held the decision date while the field did not."
