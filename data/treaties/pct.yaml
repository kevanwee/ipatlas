# Treaty pack: Patent Cooperation Treaty.
#
# `national_phase_months` here is the Treaty default. Where a designated Office allows a
# longer period, the jurisdiction pack's `patent.pct.national_phase_months` governs and the
# engine prefers it. That is why the deadline engine reads the pack first and falls back here.

treaty: pct
name: Patent Cooperation Treaty
administered_by: WIPO

timeline:
  international_search_report:
    months: 16
    from: priority_date
    cite: "PCT Rule 42.1"
    notes: ["Three months from receipt of the search copy, or 9 months from priority for a first filing, whichever expires later; 16 months is the practical outer marker."]
  international_publication:
    months: 18
    from: priority_date
    cite: "PCT Art 21(2)(a)"
  demand_for_international_preliminary_examination:
    months: 22
    from: priority_date
    cite: "PCT Rule 54bis.1(a)"
    notes: ["22 months from priority, or 3 months from transmittal of the search report and written opinion, whichever expires later."]
  national_phase_chapter_i:
    months: 30
    from: priority_date
    cite: "PCT Art 22(1)"
    notes: ["Amended with effect from 1 April 2002 to 30 months. Some Offices allow longer; the jurisdiction pack governs where it records a longer period."]
  national_phase_chapter_ii:
    months: 30
    from: priority_date
    cite: "PCT Art 39(1)(a)"

computation:
  exclude_first_day: { value: true, cite: "PCT Rule 80.1" }
  month_arithmetic: { value: corresponding_date, cite: "PCT Rule 80.2" }
  roll_non_working_forward:
    value: true
    cite: "PCT Rule 80.5"
    notes: ["Extension where the Office is not open for official business, it is an official holiday, or ordinary mail is not delivered at the locality."]

restoration_of_priority:
  available: true
  window_months: 2
  from: expiry_of_priority_period
  standards: [due_care, unintentional]
  cite: "PCT Rule 26bis.3"
  notes: ["Designated Offices apply either the 'due care' or the 'unintentional' standard, and some have reserved out. Record the applicable standard per jurisdiction pack before relying on this."]

checked: 2026-09-12
verified: false
