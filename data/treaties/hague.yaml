# Treaty pack: Hague Agreement (1999 Geneva Act).

treaty: hague
name: Hague Agreement Concerning the International Registration of Industrial Designs (Geneva Act 1999)
administered_by: WIPO

refusal_windows:
  default:
    months: 6
    from: publication_of_international_registration
    verified: true
    cite: "Geneva Act, Art 12(2)(a); Common Regulations Rule 18(1)(a)"
    notes:
      - "Art 12(2)(a) creates the duty to notify within 'the prescribed period'; Rule 18(1)(a) supplies it: six months from publication of the international registration under Rule 26(3). The run-date is publication, as recorded."
  declared_extension:
    months: 12
    from: publication_of_international_registration
    verified: true
    cite: "Common Regulations Rule 18(1)(b)"
    notes: ["A Contracting Party whose law provides for substantive examination or opposition may declare a 12-month period. The jurisdiction pack's `registered_design.hague.refusal_window_months` records which applies."]

term:
  years: 5
  from: international_registration_date
  renewable: true
  renewal_years: 5
  default_total_years: 15
  verified: true
  cite: "Geneva Act, Art 17(1)-(2); Art 17(3)(a)-(b)"
  notes:
    - "Art 17(1): an initial term of five years from the date of international registration. Art 17(2): renewable for additional five-year terms."
    - "Art 17(3)(a) supplies a DEFAULT this entry previously omitted: 'the duration of protection shall, in each of the designated Contracting Parties, be 15 years counted from the date of the international registration'. Art 17(3)(b) extends that where national law gives longer."
    - "The previous note said only that maximum duration is whatever each Contracting Party allows, which is Art 17(3)(b) and understates the Act's own 15-year default. Corrected 2026-09-12."

checked: 2026-09-12
verified: false   # per-fact flags above are authoritative
