# Office pack: USPTO.

office: USPTO
name: United States Patent and Trademark Office
jurisdiction: US
timezone: America/New_York

computation:
  exclude_first_day:
    value: true
    cite: "37 C.F.R. § 1.7"
  roll_non_working_forward:
    value: true
    cite: "37 C.F.R. § 1.7(a); 35 U.S.C. § 21(b)"
    notes:
      - "When the day for taking an action falls on a Saturday, Sunday, or federal holiday within the District of Columbia, the action may be taken on the next succeeding business day."
      - "The controlling calendar is federal holidays IN THE DISTRICT OF COLUMBIA, not state holidays."
  month_arithmetic:
    value: corresponding_date
    cite: "37 C.F.R. § 1.7"
  weekend: [saturday, sunday]

