    provenance: projected
    source: "EUIPO published days on which the Office is not open"
    checked: 2026-09-12
    verified: false
    notes:
      - "PROJECTED, NOT taken from EUIPO's published list. EUIPO closure days combine Spanish national, Valencian regional and Alicante local holidays plus an end-of-year closure. Replace with the published list before use."
    days:
