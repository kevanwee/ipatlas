# Office pack: European Union Intellectual Property Office (Alicante).

office: EUIPO
name: European Union Intellectual Property Office
jurisdiction: null
timezone: Europe/Madrid

computation:
  exclude_first_day:
    value: true
    cite: "EUTMDR Art 1; EUTMR Art 1 (periods computed from the day following the event)"
  roll_non_working_forward:
    value: true
    cite: "EUTMIR / EUTMDR provisions on time limits"
    notes: ["A period expiring on a day on which the Office is not open for receipt of documents extends to the first day thereafter on which it is open."]
  month_arithmetic:
    value: corresponding_date
    cite: "EUTMDR time-limit provisions"
  weekend: [saturday, sunday]

holidays:
