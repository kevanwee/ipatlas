      - { date: 2026-01-06, name: "Epiphany" }
      - { date: 2026-03-19, name: "San Jose (no ordinary post)" }
      - { date: 2026-04-03, name: "Good Friday" }
      - { date: 2026-04-06, name: "Easter Monday" }
      - { date: 2026-04-16, name: "Santa Faz" }
      - { date: 2026-05-01, name: "Labour Day" }
      - { date: 2026-05-25, name: "Whit Monday" }
      - { date: 2026-06-23, name: "Day before San Juan (no ordinary post)" }
      - { date: 2026-06-24, name: "San Juan" }
      - { date: 2026-10-09, name: "Day of the Valencian Community (no ordinary post)" }
      - { date: 2026-10-12, name: "Spanish National Day" }
      - { date: 2026-11-02, name: "All Souls' Day" }
      - { date: 2026-12-08, name: "Immaculate Conception (no ordinary post)" }
      - { date: 2026-12-24, name: "Christmas and end-of-year closure" }
