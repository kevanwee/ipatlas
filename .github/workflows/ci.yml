name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest
      # The data gate. A pack that breaks CLAUDE.md's rules cannot merge.
      - run: python scripts/lint_data.py
      # Internal-consistency audit: derives US federal holidays from the statutory rules,
      # checks prose weekday claims against the calendar, and enforces structural invariants.
      - run: python scripts/audit_data.py
